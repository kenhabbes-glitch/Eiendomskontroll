name: Tester
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Serverfunksjoner og logikk
        run: npm test
      - name: Skjermbildetester i nettleser
        run: |
          npx playwright install --with-deps chromium
          npm run test:nettleser
