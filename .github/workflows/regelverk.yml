# Ukentlig regelverkssjekk: sammenligner lovene og forskriftene appen viser til med gjeldende tekst hos Lovdata
# (åpne data, NLOD 2.0). Ved endringer opprettes en GitHub-sak med før/etter-tekst, utvikler får e-post og det føres
# en hendelse i appens hendelseslogg. Statusen vises på siden «Regelverk og plikter».
#
# Oppsett (én gang):
#   GitHub → Settings → Secrets and variables → Actions:
#     REGELVERK_TOKEN  – lang tilfeldig verdi (samme som i Netlify)
#     APP_URL          – f.eks. https://eiendomskontroll.netlify.app
#   Netlify → Environment variables: REGELVERK_TOKEN (samme verdi) og UTVIKLER_EPOST
name: Regelverkssjekk
on:
  schedule:
    - cron: '17 5 * * 1'   # mandager 05:17 UTC
  workflow_dispatch:
    inputs:
      godkjenn:
        description: 'Appen er oppdatert – gjør gjeldende regelverk til ny grunnlinje'
        type: boolean
        default: false
      godkjenn_mx:
        description: 'Mexico: malene er kontrollert – gjør gjeldende status til ny grunnlinje'
        type: boolean
        default: false
      godkjenn_se:
        description: 'Sverige: malene er kontrollert – ny grunnlinje'
        type: boolean
        default: false
      godkjenn_dk:
        description: 'Danmark: malene er kontrollert – ny grunnlinje'
        type: boolean
        default: false
      testvarsel:
        description: 'Send et testvarsel (e-post til utvikler og hendelseslogg) for å sjekke oppsettet'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: { group: regelverk, cancel-in-progress: false }
jobs:
  sjekk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAR_TOKEN: ${{ secrets.REGELVERK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Sjekk mot Lovdata
        run: node scripts/regelverkssjekk.mjs ${{ inputs.godkjenn && '--godkjenn' || '' }} ${{ inputs.testvarsel && '--test' || '' }}
      - name: Opprett eller oppdater GitHub-sak
        id: sak
        if: hashFiles('regelverk/varsel.json') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TYPE=$(node -p "require('./regelverk/varsel.json').type")
          if [ "$TYPE" = "test" ]; then exit 0; fi
          NR=$(gh issue list --label regelverk --state open --json number --jq '.[0].number' || true)
          if [ "$TYPE" = "godkjent" ]; then
            if [ -n "$NR" ]; then gh issue close "$NR" --comment "Appen er kontrollert mot gjeldende regelverk. Ny grunnlinje er lagret."; fi
            exit 0
          fi
          gh label create regelverk --color B60205 --description "Endringer i lover og forskrifter" 2>/dev/null || true
          if [ -n "$NR" ]; then gh issue comment "$NR" --body-file regelverk/rapport.md; URL=$(gh issue view "$NR" --json url --jq .url)
          else URL=$(gh issue create --title "Regelverk: endringer som kan kreve oppdatering av appen ($(date +%d.%m.%Y))" --label regelverk --body-file regelverk/rapport.md); fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Varsle appen (e-post til utvikler og hendelseslogg)
        id: varsle
        continue-on-error: true
        if: hashFiles('regelverk/varsel.json') != '' && env.HAR_TOKEN == 'true'
        env:
          REGELVERK_TOKEN: ${{ secrets.REGELVERK_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
          ISSUE: ${{ steps.sak.outputs.url }}
        run: |
          node -e "
            const v=require('./regelverk/varsel.json'); const k=require('./regelverk/kilder.json');
            const ctl=new AbortController(); setTimeout(()=>ctl.abort(),60000);
            fetch((process.env.APP_URL||'https://eiendomskontroll.netlify.app').replace(/\/+$/,'')+'/.netlify/functions/arbeidsordre',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','x-regelverk-token':process.env.REGELVERK_TOKEN},
              body:JSON.stringify({action:'regelverk_varsel',varsel:v,issue:process.env.ISSUE||'',antall:k.kilder.length})}).then(async r=>{const t=await r.text();console.log(r.status,t);if(!r.ok){console.log('::warning::Varsel til appen feilet ('+r.status+'). Sjekk at REGELVERK_TOKEN er lik i GitHub og Netlify, og at Netlify er deployet etter at variabelen ble satt.');process.exit(1)}}).catch(e=>{console.log('::warning::'+e.message);process.exit(1)});"
      - name: Sjekk Mexico (NOM og føderale lover)
        continue-on-error: true
        run: node scripts/regelverkssjekk-mx.mjs ${{ inputs.godkjenn_mx && '--godkjenn' || '' }}
      - name: GitHub-sak for Mexico
        if: hashFiles('regelverk/varsel-mx.json') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create regelverk-mx --color B60205 --description "Endringer i meksikanske normer og lover" 2>/dev/null || true
          NR=$(gh issue list --label regelverk-mx --state open --json number --jq '.[0].number' || true)
          if [ -n "$NR" ]; then gh issue comment "$NR" --body-file regelverk/rapport-mx.md
          else gh issue create --title "Regelverk Mexico: endringer ($(date +%d.%m.%Y))" --label regelverk-mx --body-file regelverk/rapport-mx.md; fi
      - name: Sjekk Sverige og Danmark
        continue-on-error: true
        run: |
          node scripts/regelverkssjekk-land.mjs se ${{ inputs.godkjenn_se && '--godkjenn' || '' }} || true
          node scripts/regelverkssjekk-land.mjs dk ${{ inputs.godkjenn_dk && '--godkjenn' || '' }} || true
      - name: GitHub-saker for Sverige og Danmark
        if: hashFiles('regelverk/varsel-se.json', 'regelverk/varsel-dk.json') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for L in se dk; do
            [ -f regelverk/varsel-$L.json ] || continue
            gh label create regelverk-$L --color B60205 --description "Endringer i regelverk ($L)" 2>/dev/null || true
            NR=$(gh issue list --label regelverk-$L --state open --json number --jq '.[0].number' || true)
            if [ -n "$NR" ]; then gh issue comment "$NR" --body-file regelverk/rapport-$L.md
            else gh issue create --title "Regelverk ${L^^}: endringer ($(date +%d.%m.%Y))" --label regelverk-$L --body-file regelverk/rapport-$L.md; fi
          done
      - name: Lagre status og grunnlinje
        if: always()
        run: |
          # Feilet varslingen, beholdes ikke fingeravtrykket – da prøves varselet igjen neste uke
          if [ "${{ steps.varsle.outcome }}" = "failure" ]; then git checkout -- regelverk/varslet.json 2>/dev/null || rm -f regelverk/varslet.json; fi
          rm -f regelverk/varsel.json regelverk/varsel-mx.json regelverk/varsel-se.json regelverk/varsel-dk.json
          git config user.name "regelverkssjekk"; git config user.email "actions@users.noreply.github.com"
          git add regelverk public/regelverk-status*.json 2>/dev/null || git add regelverk public/regelverk-status.json
          git diff --cached --quiet || (git commit -m "Regelverkssjekk $(date +%Y-%m-%d)" && git push)
