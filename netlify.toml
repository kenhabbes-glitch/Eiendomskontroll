[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Appen er flyttet til egen server (november 2026). Den gamle adressen videresender, slik at QR-koder og
# lenker i e-poster som allerede er sendt ut, fortsatt virker (delen etter # følger med av seg selv).
[[redirects]]
  from = "/*"
  to = "https://eiendomskontroll.knusleriet.no/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  node_bundler = "esbuild"
  # nodemailer bruker dynamiske require() som ikke tåler bundling – lastes fra node_modules ved kjøring
  external_node_modules = ["nodemailer", "ws"]
